<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>

    <!-- Subtle Inner Glow -->
    <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Gold Badge Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Soft Drop Shadow for Badge -->
    <filter id="badgeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#highlightGrad)" />
  <rect x="18" y="18" width="476" height="476" rx="108" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.15" />

  <!-- Graduation Cap (Mortarboard) -->
  <g stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.95">
    <!-- Diamond Top -->
    <polygon points="256,92 408,160 256,228 104,160" fill="#312e81" fill-opacity="0.3" stroke-width="14" />
    <!-- Cap Skull Cap Underneath -->
    <path d="M164,196 L164,250 C164,276 205,300 256,300 C307,300 348,276 348,250 L348,196" fill="#312e81" fill-opacity="0.5" stroke-width="10" />
    <!-- Tassel -->
    <path d="M140,180 L126,240 C124,250 120,260 120,270" stroke="#fcd34d" stroke-width="8" />
    <circle cx="120" cy="284" r="10" fill="#f59e0b" stroke="#fcd34d" stroke-width="4" />
  </g>

  <!-- Calculator Body -->
  <rect x="144" y="270" width="224" height="170" rx="28" fill="#1e1b4b" fill-opacity="0.6" stroke="#818cf8" stroke-width="8" />

  <!-- Calculator Screen Display -->
  <rect x="168" y="292" width="176" height="34" rx="8" fill="#0f172a" fill-opacity="0.7" stroke="#6366f1" stroke-width="3" />
  <text x="330" y="316" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold" fill="#38bdf8" text-anchor="end" letter-spacing="2">4.0 GPA</text>

  <!-- Calculator Keypad Buttons -->
  <g fill="#3730a3" stroke="#6366f1" stroke-width="2" rx="6">
    <rect x="168" y="342" width="34" height="24" rx="6" />
    <rect x="215" y="342" width="34" height="24" rx="6" />
    <rect x="262" y="342" width="34" height="24" rx="6" />
    <rect x="309" y="342" width="34" height="24" rx="6" fill="#4f46e5" />

    <rect x="168" y="376" width="34" height="24" rx="6" />
    <rect x="215" y="376" width="34" height="24" rx="6" />
    <rect x="262" y="376" width="34" height="24" rx="6" />
    <rect x="309" y="376" width="34" height="24" rx="6" fill="#4f46e5" />

    <rect x="168" y="410" width="81" height="24" rx="6" />
    <rect x="262" y="410" width="34" height="24" rx="6" />
    <rect x="309" y="410" width="34" height="24" rx="6" fill="#10b981" stroke="#34d399" />
  </g>

  <!-- Glowing Golden A+ Badge -->
  <g filter="url(#badgeShadow)">
    <circle cx="376" cy="360" r="76" fill="url(#goldGrad)" stroke="#fef08a" stroke-width="8" />
    <circle cx="376" cy="360" r="64" fill="#78350f" fill-opacity="0.4" stroke="#fbbf24" stroke-width="4" stroke-dasharray="6,4" />
    <!-- A+ Typography -->
    <text x="352" y="386" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="76" font-weight="900" fill="#ffffff" text-anchor="middle" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.3))">A</text>
    <text x="408" y="364" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="#fef08a" text-anchor="middle" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.3))">+</text>
  </g>
</svg>
